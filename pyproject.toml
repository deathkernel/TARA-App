[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tara-app-core"
version = "0.1.0"
description = "TARA-App contracts, capability registry, and safe module orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["faster-whisper>=1.1,<2"]

[project.scripts]
tara-app = "tara_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tara_app = ["web/*.html", "web/*.css", "web/*.js"]
