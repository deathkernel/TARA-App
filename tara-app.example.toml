# Copy to tara-app.toml and adjust only the local settings you need.
# All TARA language-model inference is routed through the local OmniRoute gateway.
# Keep the API key in TARA_OMNIROUTE_API_KEY (environment variable), never here.

[omniroute]
base_url = "http://127.0.0.1:20128/v1"

[omniroute.models]
chat = "auto"
code = "auto/coding:cheap"
vision = "auto"
creative = "auto/cheap"
models = "auto"

[router]
command = ["{python}", "-m", "tara_router"]
working_directory = "."
timeout_seconds = 10

# ---------------------------------------------------------------------------
# Optional MCP (Model Context Protocol) — disabled by default.
# Install: python -m pip install -e ".[mcp]"
# Only explicitly listed stdio servers are allowed. Commands are fixed argv
# lists (no shell). Do not enable filesystem/git write tools without a review.
# Tool calls require a one-shot app approval. For read-only servers, explicitly list
# the tool names you have reviewed as non-mutating; all other tools are blocked.
# ---------------------------------------------------------------------------
[mcp]
enable = false

# Built-in reference servers (still inactive until enable = true).
# Requires: python -m pip install -e '.[mcp]'
#
# [[mcp.servers]]
# name = "time"
# command = ["{python}", "-m", "tara_app.mcp_servers.time_server"]
# enabled = true
# read_only = true
# read_only_tools = ["get_current_time"]
# timeout_seconds = 30
#
# Scoped filesystem (read-only). Set TARA_MCP_FS_ROOTS to a semicolon-separated
# list of absolute directories before starting TARA.
# [[mcp.servers]]
# name = "scoped_fs"
# command = ["{python}", "-m", "tara_app.mcp_servers.scoped_fs_server"]
# enabled = true
# read_only = true
# read_only_tools = ["list_dir", "read_file"]
# timeout_seconds = 30

[[modules]]
id = "chat"
allow_remote = true # Sends prompts, recent history, and relevant memory snippets through OmniRoute.
command = ["{python}", "-m", "tara_chat.app_adapter"]
working_directory = "."
timeout_seconds = 240
environment = ["TARA_LLM_BACKEND", "TARA_CHAT_MEMORY_PATH", "TARA_OMNIROUTE_API_KEY", "TARA_OMNIROUTE_BASE_URL", "TARA_OMNIROUTE_MODEL", "TARA_OMNIROUTE_TIMEOUT_SECONDS"]

[[modules]]
id = "code"
allow_remote = true # Sends the coding request and user-supplied source attachments through OmniRoute.
command = ["{python}", "-m", "tara_code"]
working_directory = "."
timeout_seconds = 180
environment = ["TARA_CODE_API_BASE_URL", "TARA_CODE_API_KEY", "TARA_CODE_MODEL"]

[[modules]]
id = "research"
command = ["{python}", "-m", "tara_research"]
working_directory = "."
timeout_seconds = 60
allow_remote = true # Public Crossref and Wikipedia APIs; no API key required.

[[modules]]
id = "data"
command = ["{python}", "-m", "tara_data"]
working_directory = "."
timeout_seconds = 30

[[modules]]
id = "vision"
allow_remote = true # Sends user-supplied images through the configured OmniRoute vision route.
command = ["{python}", "-m", "tara_vision"]
working_directory = "."
timeout_seconds = 240
environment = ["TARA_VISION_API_BASE_URL", "TARA_VISION_API_KEY", "TARA_VISION_MODEL"]

[[modules]]
id = "planner"
command = ["{python}", "-m", "tara_planner"]
working_directory = "."
timeout_seconds = 30

[[modules]]
id = "memory"
command = ["{python}", "-m", "tara_memory"]
working_directory = "."
timeout_seconds = 30
environment = ["TARA_MEMORY_DB"]

[[modules]]
id = "security"
command = ["{python}", "-m", "tara_security"]
working_directory = "."
timeout_seconds = 30

[[modules]]
id = "creative"
allow_remote = true # Sends the creative brief through OmniRoute.
command = ["{python}", "-m", "tara_creative"]
working_directory = "."
timeout_seconds = 180
environment = ["TARA_CREATIVE_API_BASE_URL", "TARA_CREATIVE_API_KEY", "TARA_CREATIVE_MODEL"]

[[modules]]
id = "action"
command = ["{python}", "-m", "tara_action"]
working_directory = "."
timeout_seconds = 30
# Local app/browser actions need approval. GitHub writes additionally need a local token, an explicit repo allowlist, Security review, and your approval.
environment = ["GITHUB_TOKEN", "TARA_ACTION_GITHUB_REPOSITORIES"]

[[modules]]
id = "voice"
command = ["{python}", "-m", "tara_voice"]
working_directory = "."
timeout_seconds = 180
allow_remote = true # Downloads open speech weights on demand; audio processing and read-aloud remain local.
environment = ["TARA_VOICE_MODEL", "TARA_VOICE_DEVICE"]

[[modules]]
id = "handler"
command = ["{python}", "-m", "tara_app.handler_launcher", "doctor"]
working_directory = "."
timeout_seconds = 120

[[modules]]
id = "study"
command = ["{python}", "-m", "tara_study"]
working_directory = "."
timeout_seconds = 30
# Optional PDF text extraction: install tara-app-core[study]. Text and Markdown work without it.

[[modules]]
id = "weather"
command = ["{python}", "-m", "tara_weather"]
working_directory = "."
timeout_seconds = 20
allow_remote = true # Public Open-Meteo geocoding/forecast API; no API key required.

[[modules]]
id = "models"
command = ["{python}", "-m", "tara_models"]
working_directory = "."
timeout_seconds = 180
allow_remote = true # Model discovery and generation use the configured OmniRoute gateway.
environment = ["TARA_MODELS_API_BASE_URL", "TARA_MODELS_API_KEY", "TARA_MODELS_MODEL"]
