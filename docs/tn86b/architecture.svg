<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">TN-86B architecture</title><desc id="desc">Brain-inspired modules composed within TARA-App, with OmniRoute as the single LLM gateway and TARA security controls governing actions.</desc><rect width="960" height="520" rx="18" fill="#f7f8fa"/><text x="480" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#182230">TN-86B · TARA Neural-86</text><rect x="60" y="75" width="840" height="355" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="480" y="108" text-anchor="middle" font-family="Arial" font-size="18" fill="#182230">TARA-App Runtime</text><g font-family="Arial" font-size="16" text-anchor="middle" fill="#102a43"><rect x="100" y="140" width="210" height="68" rx="10" fill="#dbeafe" stroke="#3b82f6"/><text x="205" y="180">NPE · Neural Engine</text><rect x="375" y="140" width="210" height="68" rx="10" fill="#dcfce7" stroke="#22c55e"/><text x="480" y="180">ME · Memory Engine</text><rect x="650" y="140" width="210" height="68" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="755" y="180">LE · Learning Engine</text><rect x="220" y="245" width="220" height="68" rx="10" fill="#ede9fe" stroke="#8b5cf6"/><text x="330" y="285">CE · Cognitive Engine</text><rect x="520" y="245" width="220" height="68" rx="10" fill="#fce7f3" stroke="#db2777"/><text x="630" y="285">MIE · Math Intelligence</text><rect x="270" y="345" width="420" height="55" rx="10" fill="#e2e8f0" stroke="#475569"/><text x="480" y="378">MMI → NRT → VBE (integration / planned)</text></g><path d="M205 208V225H330V245 M480 208V245 M755 208V225H630V245 M330 313V345 M630 313V345" fill="none" stroke="#64748b" stroke-width="2"/><text x="480" y="465" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">OmniRoute: sole configured LLM gateway · TARA Security: approval authority</text><text x="480" y="493" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Brain-inspired software architecture; not a biological brain simulation.</text></svg>